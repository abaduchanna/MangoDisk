[package]
name = "mangodisk"
version = "1.1.7"
description = "MangoDisk - Disk cleanup, storage analysis, and privacy protection"
edition = "2021"

[lib]
name = "mangodisk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.12.1", features = [] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
log = "0.4.34"
tauri-plugin-dialog = "2.8.1"
tauri-plugin-fs = "2.6.0"
tauri-plugin-log = "2.10.0"
tauri-plugin-opener = "2.7.0"
tauri-plugin-os = "2.4.0"
tauri-plugin-process = "2.4.0"
tauri-plugin-store = "2.5.0"

[target.'cfg(target_os = "android")'.dependencies]
libc = "0.2"
