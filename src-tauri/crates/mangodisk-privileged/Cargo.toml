[package]
name = "mangodisk-privileged"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "MangoDiskPrivileged"
path = "src/main.rs"

[dependencies]
mangodisk-privileged-protocol = { path = "../mangodisk-privileged-protocol" }
serde_json = "1.0.151"

[target.'cfg(windows)'.dependencies]
sha2 = "0.10.9"
tokio = { version = "1.53.0", features = ["rt", "net", "io-util", "time", "sync", "macros"] }
windows-service = "0.8.1"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Devices_DeviceAndDriverInstallation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_WinTrust", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Diagnostics_Debug", "Win32_System_EventLog", "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_System_Registry", "Win32_System_Pipes", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
embed-resource = "3.0.12"
tauri-winres = "0.3.6"

[dev-dependencies]
sha2 = "0.10.9"
tempfile = "3.27.0"
