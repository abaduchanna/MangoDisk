name: android-apk
on:
  push:
    branches: [android-apk]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Detect Android NDK
        run: echo "ANDROID_NDK_HOME=$(ls -d ${ANDROID_HOME}/ndk/* | sort | tail -1)" >> $GITHUB_ENV

      - name: Install Rust toolchain + Android targets
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: aarch64-linux-android
          rustflags: ""
          override: false

      - name: Install node deps (tauri CLI + shim)
        run: npm install --no-audit --no-fund

      - name: Build debug APK (arm64)
        run: ./node_modules/.bin/tauri android build --apk --debug --target aarch64

      - name: Locate APK
        run: |
          find src-tauri/gen/android -name "*.apk" -exec ls -la {} \;
          echo "APK_PATH=$(find src-tauri/gen/android -name '*debug*.apk' | head -1)" >> $GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: MangoDisk-1.1.7-android-arm64
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
